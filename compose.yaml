name: tvm-powercare
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tvm}
      POSTGRES_USER: ${POSTGRES_USER:-tvm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    ports:
      - "127.0.0.1:${TVM_DB_PORT:-55432}:5432"
    volumes:
      - tvm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    profiles: ["container"]
    image: tvm-powercare-web:local
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tvm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tvm}
      TVM_MEDIA_ROOT: /app/backend/media
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tvm_media:/app/backend/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, os, urllib.request;
          host = os.environ.get('DJANGO_ALLOWED_HOSTS', 'localhost').split(',')[0].strip() or 'localhost';
          host = ('healthcheck' + host) if host.startswith('.') else ('localhost' if host == '*' else host);
          request = urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'});
          data = json.load(urllib.request.urlopen(request, timeout=3));
          assert data.get('status') == 'ok' and data.get('database') == 'ok'
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --no-control-socket --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"]
  reminders:
    profiles: ["container"]
    image: tvm-powercare-web:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tvm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tvm}
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "manage.py", "logistics_reminders"]
volumes:
  tvm_postgres:
  tvm_media:
